<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalisti & Moonshot Day 2026: The Next Decade Photo Frame Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="generator">

        <div class="preview">
            <canvas id="canvas" width="1080" height="1080"></canvas>
        </div>

        <div class="controls">

            <div class="control-section">
                <h2>1. Upload your photo</h2>

                <label class="upload-button">
                    Choose photo
                    <input
                        type="file"
                        id="photoInput"
                        accept="image/*"
                        hidden
                    >
                </label>
            </div>

            <div class="control-section">

                <h2>2. Position and resize your photo</h2>

                <p class="help">
                    Drag the photo to reposition it. Drag one of the corner handles to resize it.
                </p>
                
                <button id="resetButton" class="secondary-button">
                    Reset photo
                </button>

            </div>

            <div class="control-section">

                <h2>3. Download</h2>

                <button id="downloadButton" class="download-button" disabled>
                    Download image
                </button>

                <p class="privacy">
                    Your photo is processed securely in your browser and is never uploaded or stored by Catalisti.
                </p>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
